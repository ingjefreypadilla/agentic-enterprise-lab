# Build, test, and publish Docker image to GHCR on pushes to main
name: Build and Publish to GHCR

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/agent-runtime

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      
      - name: Run tests
        run: |
          pytest tests/ -v

  build-and-push:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    outputs:
      image-tag: ${{ steps.set_image_tag.outputs.tag }}
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set image tag
        id: set_image_tag
        run: |
          # Extract commit SHA (first 7 characters) for immutable tag
          COMMIT_SHA=${{ github.sha }}
          
          # Build date in YYYYMMDDHHmmss format
          BUILD_DATE=$(date -u +"%Y%m%d%H%M%S")
          
          echo "tag=${{ env.IMAGE_NAME }}:${COMMIT_SHA}-${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "image_tag=${{ env.IMAGE_NAME }}:${COMMIT_SHA}-${BUILD_DATE}" > $GITHUB_OUTPUT
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.set_image_tag.outputs.image_tag }}
          build-args: |
            BUILD_DATE=${{ steps.set_image_tag.outputs.build_date }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
