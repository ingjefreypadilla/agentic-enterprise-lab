name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: services/agent-runtime
        run: |
          python -m pip install --upgrade 'pip==26.3'
          python -m pip install --constraint requirements.lock --editable '.[dev]'

      - name: Lint
        working-directory: services/agent-runtime
        run: ruff check app tests

      - name: Test
        working-directory: services/agent-runtime
        run: pytest -v --tb=short --cov=app

      - name: Build Docker image
        working-directory: services/agent-runtime
        run: docker build --tag agent-runtime:ci .

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}/agent-runtime
          tags: |
            type=sha,format=long,prefix=sha-

      - name: Build and publish Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/agent-runtime
          file: services/agent-runtime/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check out latest main for manifest update
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Update Kubernetes image
        id: manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}/agent-runtime:sha-${{ github.sha }}
        run: |
          manifest_path=deploy/k3s/deployment.yaml

          if ! git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
            echo "A rewritten main branch superseded this run; skipping the manifest update."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git diff --quiet "$GITHUB_SHA..HEAD" -- . \
            ':(exclude)deploy/k3s/deployment.yaml'; then
            echo "A newer source commit superseded this run; its workflow will update the manifest."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$(grep -c '^[[:space:]]*image:' "$manifest_path")" -eq 1
          awk -v image="$IMAGE" '
            /^[[:space:]]*image: .*agent-runtime:sha-[0-9a-f]{40}$/ {
              sub(/image:.*/, "image: " image)
              replacements++
            }
            { print }
            END { if (replacements != 1) exit 1 }
          ' "$manifest_path" > "${manifest_path}.tmp"
          mv "${manifest_path}.tmp" "$manifest_path"
          grep -Fqx "          image: ${IMAGE}" "$manifest_path"

          if git diff --quiet -- "$manifest_path"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push Kubernetes image update
        if: steps.manifest.outputs.changed == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k3s/deployment.yaml
          git commit -m "chore: update Agent Runtime image to sha-${GITHUB_SHA} [skip ci]"

          if ! git push origin "HEAD:${BRANCH}"; then
            echo "::error::${BRANCH} advanced during the update; refusing to overwrite it."
            exit 1
          fi
