apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-runtime
  namespace: agentic-lab
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: agentic-enterprise-lab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-runtime-pod-reader
  namespace: agentic-lab
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: agentic-enterprise-lab
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-runtime-pod-reader
  namespace: agentic-lab
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: agentic-enterprise-lab
subjects:
  - kind: ServiceAccount
    name: agent-runtime
    namespace: agentic-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-runtime-pod-reader
